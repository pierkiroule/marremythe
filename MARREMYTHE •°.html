<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0a14"><title>MARREMYTHE •°</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&display=swap">
<style>
:root{--bg:#0a0a14;--fg:#f8f3ec;--mut:#a9a6bb;--vio:#bda9ff;--gold:#ffd27a;--ember:#ff9a5a;--teal:#78e6df;--bd:#ffffff1f;--c1:#e9c8ff;--c2:#7562ff;--c3:#78e6df;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:400 15px/1.6 'DM Sans',system-ui,sans-serif}body{overflow-x:hidden}
button,textarea{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}#bg{z-index:0}#fx{z-index:40}
.aur{position:fixed;inset:-20%;z-index:0;pointer-events:none;background:radial-gradient(40% 35% at 20% 25%,#6a3cff30,transparent 70%),radial-gradient(35% 30% at 80% 70%,#ff8a4a22,transparent 70%),radial-gradient(30% 30% at 60% 15%,#2fd3c41c,transparent 70%);animation:drift 24s ease-in-out infinite alternate}
.app{position:relative;z-index:1;max-width:700px;margin:auto;padding:18px 20px 70px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}.brand{font:900 17px/1 Fraunces,Georgia,serif;letter-spacing:.02em}.brand span{color:var(--gold)}
.steps{display:flex;align-items:center;gap:4px}.steps i{width:8px;height:1px;background:var(--bd)}.st{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;border:1px solid var(--bd);background:#ffffff08;filter:grayscale(1) opacity(.5);transition:.4s}.st.done{filter:none;opacity:.8}.st.on{filter:none;border-color:var(--gold);box-shadow:0 0 18px #ffd27a55;transform:scale(1.18)}
.eb{color:var(--gold);font-size:14px;font-weight:700;margin:10px 0 12px}
h1{font:900 clamp(40px,9.5vw,72px)/.98 Fraunces,Georgia,serif;letter-spacing:-.035em;margin:0 0 14px}
p{color:var(--mut);margin:0 0 10px}.hint{font-size:12.5px;color:var(--mut)}.center{text-align:center}
.tag{font:700 14px Fraunces,serif;color:var(--vio);margin:24px 0 2px}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:20px 0 10px}
.chip{position:relative;display:flex;gap:11px;align-items:center;min-height:76px;text-align:left;border:1px solid var(--bd);border-radius:18px;padding:14px 12px;background:linear-gradient(160deg,#ffffff10,#ffffff04);transition:transform .18s,border-color .2s,background .2s,box-shadow .2s}
.chip.in{animation:jar .55s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--i)*45ms)}
.chip:before{content:'';position:absolute;top:-4px;left:50%;width:30px;height:6px;border-radius:5px;background:#ffffff30;transform:translateX(-50%);transition:.3s}
.chip:active{transform:scale(.95)}.chip.sel{border-color:var(--gold);background:linear-gradient(160deg,#ffd27a24,#8c69ff18);box-shadow:0 0 26px #ffd27a26}
.chip.sel:before{background:var(--gold);transform:translate(-50%,-6px) rotate(-9deg)}.chip.sel .em{animation:bounce .6s}
.em{font-size:28px}.tx{font-size:13.5px;font-weight:700;line-height:1.25}.tx small{display:block;font-size:11.5px;color:var(--mut);font-weight:400;margin-top:3px}
.ob{margin-top:14px}.ob textarea{display:block;width:100%;min-height:80px;resize:vertical;border:1px solid #ffffff35;background:#141624;border-radius:16px;padding:13px;margin-top:8px}
.footer{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}.footer.stick{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:5;padding:8px;border-radius:20px;background:#0a0a14cc}
.btn,.back{border-radius:16px;padding:16px 20px;font-weight:700;transition:.2s}
.btn{flex:1;border:0;color:#2a1608;background:linear-gradient(135deg,#ffe29a,#ff9a5a);box-shadow:0 8px 28px #ff9a5a40}.btn:disabled{opacity:.28;box-shadow:none;cursor:not-allowed}.btn:not(:disabled):active{transform:scale(.97)}
.btn:not(:disabled){animation:ready 2s ease-in-out infinite}
.back{border:1px solid var(--bd);background:#ffffff08}.mini{display:block;margin:6px auto 0;border:1px solid var(--bd);background:#ffffff08;border-radius:99px;padding:8px 16px;font-size:13px}
/* marmite */
.scene{height:400px;position:relative;perspective:900px;touch-action:none;user-select:none;-webkit-user-select:none;margin:6px 0 0}
.cam{position:absolute;inset:0;will-change:transform}
.glow{position:absolute;left:50%;top:200px;width:380px;height:240px;margin-left:-190px;border-radius:50%;background:radial-gradient(closest-side,#ff9a5acc,#ff5a2a55 55%,transparent);opacity:calc(.22 + var(--h,0)*.78)}
.logs{position:absolute;left:50%;top:322px;transform:translateX(-50%);font-size:46px;letter-spacing:-10px;white-space:nowrap;text-shadow:0 6px 10px #000}
.cauldron{position:absolute;left:50%;top:148px;width:250px;height:190px;margin-left:-125px}
.potbody{position:absolute;top:45px;left:12px;width:226px;height:155px;border-radius:15px 15px 105px 105px;background:linear-gradient(115deg,#5c5a74,#272738 42%,#0d101a 88%);border:2px solid #7a798f;box-shadow:inset 18px 0 26px #ffffff12,inset -25px -14px 34px #0009,0 26px 30px -8px #000c;display:grid;place-items:center;padding-top:34px;text-align:center;font:900 15px/1.1 Fraunces,serif;color:#ffd27a;opacity:.98}
.potbody span{opacity:.38;letter-spacing:.14em}
.rim{position:absolute;z-index:3;top:20px;left:0;width:250px;height:70px;border-radius:50%;border:12px solid #807b92;background:radial-gradient(ellipse,var(--c1) 0%,var(--c2) 28%,#2d1c63 55%,#15111e 72%);box-shadow:0 0 calc(20px + var(--h,0)*80px) #c08aff,inset 0 0 calc(20px + var(--h,0)*30px) #ffe0ff90;overflow:hidden}
.liquid{position:absolute;inset:-10%;background:conic-gradient(var(--c1),var(--c2),var(--c3),var(--c1));opacity:.55;animation:spin 5s linear infinite}
.rim.hit{filter:brightness(2)}.handle{position:absolute;top:60px;width:35px;height:65px;border:8px solid #79738a;border-radius:50%;z-index:-1}.handle.l{left:-20px}.handle.r{right:-20px}
.leg{position:absolute;bottom:-4px;width:20px;height:18px;border-radius:4px 4px 10px 10px;background:#1a1b28;border:2px solid #6c6b80}.leg.a{left:50px}.leg.b{right:50px}
.cauldron.done .liquid{opacity:.95;animation-duration:1.2s}
.ing{position:absolute;z-index:5;font-size:34px;line-height:1;background:none;border:0;padding:6px;text-shadow:0 0 14px #ffd27a;animation:float 3s ease-in-out infinite;animation-delay:var(--d)}
.ing.gone{visibility:hidden;pointer-events:none}.ing:hover{text-shadow:0 0 20px #fff}
.ladle{position:absolute;left:0;top:0;z-index:9;font-size:50px;pointer-events:none;opacity:0;transition:opacity .25s;text-shadow:0 6px 8px #000a}.ladle.on{opacity:1}
.gauge{height:10px;border-radius:9px;background:#ffffff14;overflow:hidden;margin:14px 0 8px;border:1px solid var(--bd)}.gauge div{height:100%;width:0;background:linear-gradient(90deg,#78e6df,#bda9ff,#ff9a5a,#ffd27a);box-shadow:0 0 14px #ffd27a}
.plop{position:absolute;left:50%;top:16%;z-index:12;font:900 clamp(46px,14vw,84px)/1 Fraunces,serif;color:var(--gold);text-shadow:0 0 30px #ff9a5a,0 4px 0 #8a3b12;transform:translateX(-50%);animation:plop 1.2s cubic-bezier(.2,1.4,.4,1) forwards;pointer-events:none}
/* arômes */
.world{position:fixed;inset:0;z-index:20;background:radial-gradient(ellipse at 50% 70%,#2c2352 0%,#0b0b18 58%,#05060c 100%);overflow:hidden;opacity:0;pointer-events:none;transition:opacity .8s}.world.active{opacity:1;pointer-events:auto}
.wh{position:absolute;z-index:4;top:calc(env(safe-area-inset-top,0px) + 34px);left:20px;right:20px;text-align:center;opacity:0;transform:translateY(20px);transition:1s .6s}.world.ready .wh{opacity:1;transform:none}
.wh h2{font:900 clamp(34px,8vw,60px)/1 Fraunces,serif;letter-spacing:-.035em;margin:6px 0}.wh p{font-size:13.5px}
.worldbubble{position:absolute;z-index:3;width:var(--sz);height:var(--sz);border:0;background:none;padding:0;opacity:0}
.world.ready .worldbubble{animation:emerge 1.2s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*.14s)}
.bi{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;font-size:clamp(32px,8vw,52px);border:1px solid #e7dfffaa;background:radial-gradient(circle at 26% 18%,#fff9,transparent 17%),radial-gradient(circle at 78% 83%,#9d87ff77,transparent 53%),radial-gradient(circle at 40% 42%,#fff1,#a392dd24 70%);box-shadow:inset -12px -12px 27px #c0b0ff28,inset 7px 7px 24px #ffffff17,0 0 50px #ad8aff3c;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:orbit var(--speed) ease-in-out infinite alternate;animation-delay:var(--delay);transition:box-shadow .3s}
.worldbubble:hover .bi{box-shadow:inset 0 0 30px #fff5,0 0 80px #e0bfff}.worldbubble.chosen{z-index:8}.worldbubble.chosen .bi{animation:none;transform:scale(1.22);box-shadow:0 0 110px #ffd27a,inset 0 0 36px #fff;border-color:var(--gold)}
.bl{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12.5px;text-shadow:0 2px 10px #000}
.taste{position:absolute;z-index:6;left:20px;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);max-width:420px;margin:auto;display:flex;gap:14px;align-items:center;padding:12px 16px;border-radius:20px;border:1px solid #ffd27a66;background:#14122a;box-shadow:0 0 30px #ffd27a22;animation:jar .5s both}.taste[hidden]{display:none}.taste>span{font-size:34px}.taste b{font:700 16px Fraunces,serif;display:block}.taste small{color:var(--mut)}
.wbot{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);left:20px;right:20px;z-index:7;display:flex;justify-content:center;gap:10px}
.wbot button{background:#ffffff14;border:1px solid #ffffff3b;border-radius:99px;padding:12px 18px;backdrop-filter:blur(15px)}.wbot .primary{background:linear-gradient(135deg,#ffe29a,#ff9a5a);color:#2a1608;font-weight:700;border:0}.wbot [hidden]{display:none}
.portal{position:absolute;inset:0;z-index:10;pointer-events:none;opacity:0;background:radial-gradient(circle,#fff 0%,#ffd27a 12%,#8a63ff 34%,transparent 70%);transform:scale(.03);transition:transform 1.1s cubic-bezier(.15,.65,.2,1),opacity .6s}.portal.open{opacity:1;transform:scale(6)}
#flash{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:0;background:radial-gradient(circle,#fff,#ffd27a88 40%,transparent 75%)}#flash.go{animation:flash .7s ease-out}
/* service */
.cloche{display:grid;place-items:center;margin:30px 0 10px;text-align:center}.cl{font-size:130px;line-height:1;background:none;border:0;text-shadow:0 0 40px #ffd27a;animation:bob 2.2s ease-in-out infinite}.cl.lift{animation:lift .9s cubic-bezier(.5,0,.8,.4) forwards}
.myth{border:1px solid #ffffff26;border-radius:26px;background:linear-gradient(150deg,#26203a,#0f1019);padding:26px 22px;margin:22px 0;box-shadow:0 0 60px #8a63ff22;overflow:hidden}
.halo{font-size:78px;line-height:1;text-align:center;text-shadow:0 0 30px #ffd27a;transform:scale(.2) rotate(-40deg);opacity:0;transition:1s cubic-bezier(.2,1.5,.4,1)}.show .halo{transform:none;opacity:1}
.myth h2{font:900 clamp(28px,7vw,40px)/1.05 Fraunces,serif;letter-spacing:-.03em;text-align:center;margin:10px 0 6px}.myth .sub{text-align:center;font-size:13px}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 12px}.meta div{text-align:center;border:1px dashed #ffffff33;border-radius:14px;padding:9px 4px}.meta b{display:block;font:700 18px Fraunces,serif;color:var(--gold)}.meta span{font-size:11.5px;color:var(--mut)}
.flav{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-bottom:8px}.flav span{font-size:12px;color:var(--mut)}.flav i{display:block;height:6px;border-radius:5px;background:#ffffff14;margin-top:3px;position:relative;overflow:hidden}.flav i:after{content:'';position:absolute;inset:0;width:0;background:linear-gradient(90deg,var(--vio),var(--gold));transition:width 1.4s .6s}.show .flav i:after{width:calc(var(--v)*100%)}
.sec{opacity:0;transform:translateY(16px);transition:.8s calc(.5s + var(--k)*.55s);margin-top:20px}.show .sec{opacity:1;transform:none}
.sec h3{font:700 15px Fraunces,serif;color:var(--vio);margin:0 0 6px;display:flex;gap:8px;align-items:center}.sec p{color:#ece6f2;margin:0;font-size:15.5px}.sec.chef{border:1px dashed var(--gold);border-radius:16px;padding:14px}.sec.chef h3{color:var(--gold)}
@keyframes drift{to{transform:translate(4%,3%) rotate(6deg) scale(1.1)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-14px) rotate(10deg)}}@keyframes bounce{40%{transform:scale(1.5) rotate(-12deg)}}
@keyframes jar{from{opacity:0;transform:translateY(16px) scale(.9)}}@keyframes ready{50%{box-shadow:0 8px 40px #ff9a5a99}}@keyframes bob{50%{transform:translateY(-12px) rotate(-3deg)}}
@keyframes lift{to{transform:translateY(-70vh) rotate(-24deg) scale(1.4);opacity:0}}@keyframes flash{from{opacity:.85}to{opacity:0}}@keyframes plop{0%{transform:translateX(-50%) scale(.2) rotate(-12deg);opacity:0}30%{opacity:1}100%{transform:translateX(-50%) translateY(-60px) scale(1.15) rotate(4deg);opacity:0}}
@keyframes orbit{0%{transform:translate3d(-16px,20px,0) rotate(-9deg) scale(.95)}50%{transform:translate3d(17px,-28px,0) rotate(12deg) scale(1.07)}100%{transform:translate3d(-8px,9px,0) rotate(-6deg) scale(.97)}}@keyframes emerge{from{opacity:0;transform:translateY(80vh) scale(.2)}to{opacity:1;transform:none}}
@media(min-width:560px){.chips{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head><body>
<canvas id="bg"></canvas><div class="aur"></div>
<main class="app"><header class="top"><div class="brand">MARREMYTHE<span>•°</span></div><div class="steps" id="steps"></div></header><section id="view" aria-live="polite"></section></main>
<div id="world" class="world" aria-hidden="true"><canvas id="wc" style="z-index:0"></canvas><div class="wh"><div class="eb">🫧 Les arômes</div><h2>Quelle saveur<br>t’appelle ?</h2><p>Une bulle remonte pour chaque possible. Touche celle qui te parle.</p></div><div id="wb"></div><div class="taste" id="taste" hidden></div><div class="wbot"><button id="reshuffle">↻ Autres arômes</button><button id="wback">← Marmite</button><button id="wnext" class="primary" hidden>Servir le plat 🍽️</button></div><div class="portal" id="portal"></div></div>
<canvas id="fx"></canvas><div id="flash"></div>
<script>
/* ===== Moteur de mythes (aucune répétition : mémoire locale des fragments déjà servis) ===== */
let HIST={};try{HIST=JSON.parse(localStorage.getItem('mm_hist')||'{}')}catch(e){}
const rnd=a=>a[Math.floor(Math.random()*a.length)],cap=s=>s[0].toUpperCase()+s.slice(1),lc=s=>s[0].toLowerCase()+s.slice(1),J=a=>a.length>1?a.slice(0,-1).join(', ')+' et '+a[a.length-1]:a[0];
function pick(k,a){const u=HIST[k]||(HIST[k]=[]);let f=a.map((_,i)=>i).filter(i=>!u.includes(i));if(!f.length){u.length=0;f=a.map((_,i)=>i)}const i=rnd(f);u.push(i);try{localStorage.setItem('mm_hist',JSON.stringify(HIST))}catch(e){}return a[i]}
const TY=[
['🪨','Le fardeau','Tout porter','des épaules lourdes',['Dans la vallée des Épaules, chaque pas faisait tinter une pierre de plus au fond des sacs.','Au village, on se passait le ciel à tour de rôle, et personne ne se rappelait qui l’avait confié.','Sur la route du col, les sacs poussaient comme des champignons : un par promesse tenue trop vite.'],[['Atlas','le poids du monde et la question de ce que l’on choisit de porter'],['Saint Christophe','le passeur dont la charge change de nature à mesure qu’il traverse']]],
['🔁','La boucle','Toujours pareil','de la roue qui tourne',['Là-bas, le soleil se levait toujours à la même minute, au-dessus de la même tasse posée au même endroit.','Les jours s’y empilaient comme des assiettes identiques, et chacun portait le même numéro.','Le moulin du bourg tournait sans farine, par habitude, et tout le monde faisait semblant d’y croire.'],[['Sisyphe','la répétition et la possibilité de changer son rapport à l’effort'],['Ixion','la roue qui tourne et l’art d’apprendre à en descendre']]],
['🔒','La cage','Être coincé','des murs qui respirent',['Les murs du royaume se rapprochaient chaque nuit d’un doigt, et les fenêtres rapetissaient en silence.','On y vivait dans une tour dont l’escalier ne montait jamais, ni ne descendait vraiment.','Les portes y étaient nombreuses, mais chacune s’ouvrait sur une pièce identique à la précédente.'],[['Dédale','l’enfermement, l’invention d’une issue et le fil du chemin'],['Prométhée enchaîné','la contrainte, l’entêtement et ce que l’on garde de soi malgré les chaînes']]],
['👻','L’invisible','Ne pas compter','de l’invisible',['Dans la ville de verre, on se traversait comme des courants d’air, sans que personne ne se retourne.','Les mots y tombaient en silence, comme des gouttes sur du sable sec.','Au banquet du royaume, il y avait mille couverts, mais aucun ne portait son nom.'],[['Psyché','la reconnaissance, les épreuves et la découverte de soi'],['Écho','la voix que l’on renvoie aux autres, jusqu’à retrouver la sienne']]],
['⚔️','La bataille','Toujours lutter','des mille combats',['Le pays n’était qu’une longue frontière, et chaque matin demandait de reprendre le même bouclier.','Les épées y repoussaient comme l’herbe : à peine coupées, déjà debout.','Même la soupe, dans ce royaume, se mangeait au garde-à-vous.'],[['Héraclès','les épreuves, la force et ses limites'],['Achille','la puissance et la vulnérabilité qu’elle abrite']]],
['🌫️','Le brouillard','Ne plus comprendre','des brumes',['Une brume douce recouvrait les routes, et les panneaux s’y répondaient sans jamais s’accorder.','On y marchait à tâtons, et chaque lanterne n’éclairait que son propre halo.','Les cartes du pays y changeaient de forme à mesure qu’on les dépliait.'],[['Thésée et Ariane','la traversée du labyrinthe et l’importance du fil des liens'],['Œdipe','l’énigme, la quête de sens et la connaissance de soi']]],
['🪫','L’épuisement','Ne plus avoir d’énergie','des saisons fatiguées',['Le royaume vivait un long automne : les feuilles tombaient, mais plus rien ne se préparait à repousser.','Les horloges y ralentissaient, et même le vent s’appuyait souvent contre les murs pour souffler.','Les fours du village s’éteignaient les uns après les autres, faute de souffle.'],[['Déméter et Perséphone','les saisons intérieures, la perte et le retour du vivant'],['Antée','la force qui revient au contact de la terre']]],
['🧩','Le décalage','Ne pas trouver ma place','de la rive d’à côté',['Dans le pays des pièces assorties, il manquait toujours une encoche à la pièce qui cherchait sa forme.','À chaque table, on tendait une chaise un peu trop haute, ou un peu trop loin.','Les cartes y indiquaient mille places, mais aucune ne portait de nom.'],[['Ulysse','l’errance, l’appartenance et le retour transformé'],['Les Argonautes','chercher sa place dans un équipage dépareillé']]],
['⏳','L’attente','Rien ne bouge','du fil patient',['Le sablier du royaume restait en suspens, et les grains attendaient, poliment, de savoir quoi faire.','On y guettait l’horizon depuis si longtemps que l’horizon avait fini par s’asseoir aussi.','Les saisons y faisaient la queue devant une porte qui ne s’ouvrait pas.'],[['Pénélope','l’attente, la persévérance et le pouvoir de tisser autrement'],['Pandore','l’espérance restée au fond de la jarre, quand tout semblait s’échapper']]],
['💔','La blessure','Ce qui fait mal','de la fêlure dorée',['Au cœur du pays courait une fêlure, et chacun marchait doucement autour, comme autour d’un lac gelé.','Les cloches du village sonnaient un peu faux, depuis un jour que plus personne n’osait nommer.','Dans la maison aux mille tasses, une seule était ébréchée, et c’était toujours celle qu’on servait.'],[['Chiron','la blessure et la sagesse qui peut parfois en émerger'],['Philoctète','la blessure qui isole, puis qui rappelle aux autres']]],
['✳️','Autre','Ma propre plainte','du chaudron secret',['Le pays avait un nom que personne n’osait prononcer à voix haute, et pourtant tout le monde y vivait.','Dans cette contrée sans carte, chaque jour ressemblait à une question pas encore posée.','Les horloges y marquaient une heure inconnue, mais le chaudron, lui, savait.'],[['Hermès','le messager qui traverse les seuils et fait circuler le sens'],['Ulysse','l’errance, l’appartenance et le retour transformé']]]];

 const worlds=ti.map((i,k)=>{const w=pick('w'+i,TY[i][4]);return k?(k===1?'Plus loin, ':'Et comme si cela ne suffisait pas, ')+lc(w):w});
 const sections=[['🧺','Les ingrédients',pick('in',INTRO)(N,pr[1],subs.join(' / '))+' '+worlds.join(' ')],['🔥','La cuisson',pick('tr',TRIAL)(c)],['🌿','L’assaisonnement',pick('ch',CHANGE)(c)+' '+pick('nu',NUA)],['🍽️','À déguster',pick('qu',QUEST)(c)]];

 if(state.step===4){const R=state.res||(state.res=gen(state));
  if(!state.open)h=`<div class="eb">🍽️ Le service</div><h1>Ton plat<br>est prêt.</h1><p>Soulève la cloche pour découvrir le mythe qui a mijoté.</p><div class="cloche"><button class="cl" id="cl" aria-label="Soulever la cloche">🍽️</button></div>`;
  else{const mm=Math.max(1,Math.round(state.ms/1000)),nI=ING.length||ingList().length,fl=[['Amer',state.type.length/3],['Piquant',state.emotion.length/2],['Herbes',state.need.length/2],['Douceur',.45+Math.random()*.5]];
   h=`<div class="eb">🍽️ Le service</div><h1>À table !</h1><article class="myth" id="myth"><div class="halo">${R.emoji}</div><h2>${esc(R.title)}</h2><p class="sub">Une histoire possible, pas une interprétation de ta personne.</p><div class="meta"><div><b>${nI}</b><span>ingrédients</span></div><div><b>${mm>=60?Math.floor(mm/60)+' min '+(mm%60)+' s':mm+' s'}</b><span>de mijotage</span></div><div><b>1</b><span>humain servi</span></div></div><div class="flav">${fl.map(([l,v])=>`<div><span>${l}</span><i style="--v:${Math.min(1,v).toFixed(2)}"></i></div>`).join('')}</div>${R.sections.map((s,k)=>`<section class="sec" style="--k:${k}"><h3><span>${s[0]}</span>${s[1]}</h3><p>${esc(s[2])}</p></section>`).join('')}<section class="sec chef" style="--k:4"><h3><span>👩‍🍳</span>Le conseil du chef</h3><p>${esc(R.chef)}</p></section><section class="sec" style="--k:5"><h3><span>📜</span>Écho culturel</h3><p><b>${esc(R.echo[0])}</b> — ${esc(R.echo[1])}.</p><p class="hint">Une résonance symbolique, pas une équivalence.</p></section></article><div class="footer"><button class="back" id="restart">🧺 Nouvelle recette</button><button class="back" id="again">🔁 Re-mijoter</button><button class="btn" id="copy" style="flex:1 1 100%">Copier ma recette</button></div>`}}

  const sp=e=>{const r=scene.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top,r]};

  scene.onpointermove=e=>{const[x,y,r]=sp(e);trx=-(y/r.height-.5)*10;tryy=(x/r.width-.5)*14;if(e.pointerType==='mouse')ladle.classList.add('on');moveL(e);if(!drag)return;
   const q=pot.getBoundingClientRect(),a=Math.atan2(e.clientY-(q.top+60),e.clientX-(q.left+q.width/2));if(la!==null){let d=a-la;if(d>Math.PI)d-=6.283;if(d<-Math.PI)d+=6.283;add(Math.abs(d)/6.283*.2+Math.hypot(e.movementX||0,e.movementY||0)/5000)}la=a;if(state.th.length===ING.length&&!state.done&&fr%3===0)burst(e.clientX,e.clientY,2,.5)};

 el.animate([{transform:'translate(0,0) scale(1) rotate(0)',opacity:1},{transform:`translate(${dx*.5}px,${dy-120}px) scale(1.5) rotate(200deg)`,offset:.45,opacity:1},{transform:`translate(${dx}px,${dy}px) scale(.4) rotate(420deg)`,offset:.92,opacity:.9},{transform:`translate(${dx}px,${dy+8}px) scale(0)`,opacity:0}],{duration:820,easing:'cubic-bezier(.3,.1,.5,1)',fill:'forwards'}).onfinish=()=>{el.classList.add('gone');if(!state.th.includes(i))state.th.push(i);const q=pot.getBoundingClientRect(),x=q.left+q.width/2,y=q.top+56;burst(x,y,18,1);ring(x,y,rnd(COL),6);for(let k=0;k<4;k++)P('o',x+(Math.random()-.5)*80,y,0,0,30,3,rnd(COL));for(let k=0;k<5;k++)P('m',x+(Math.random()-.5)*60,y-4,0,-1.2,60,12,'');pot.animate([{transform:'scale(1)'},{transform:'scale(1.06,.93)',offset:.4},{transform:'scale(1)'}],{duration:320});const rm=$('#rim');rm.classList.add('hit');setTimeout(()=>rm.classList.remove('hit'),140);vib(12);if(state.th.length===ING.length){ring(x,y,'#78e6df',10);vib([10,40,10]);const ta=$('#throwall');if(ta)ta.remove()}}}

 ring(x,y,'#ffd27a',10);setTimeout(()=>ring(x,y,'#bda9ff',8),180);setTimeout(()=>ring(x,y,'#78e6df',6),360);burst(x,y,70,1.7);confetti(x,y-20,70);flash();vib([30,40,60]);

 const pl=document.createElement('div');pl.className='plop';pl.textContent='PLOP !';scene.append(pl);setTimeout(()=>pl.remove(),1300);$('#next').disabled=false}
